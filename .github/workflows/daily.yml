name: Coleta diária de preços Shopee

on:
  schedule:
    - cron: "0 12 * * *"  # 12:00 UTC ≈ 09:00 em Porto Alegre (ajustar no horário de verão)
  workflow_dispatch: {}    # permite rodar manualmente pelo GitHub

jobs:
  coletar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopee-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Rodar coleta
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commitar histórico de preços atualizado
        run: |
          git config user.name "shopee-tracker-bot"
          git config user.email "actions@github.com"
          git add price_history.db
          git diff --staged --quiet || git commit -m "Atualiza histórico de preços"
          git push
